# CI = Continuous Integration: on every push and PR, prove the code still works.
# This job runs on GitHub's own machines (no laptop involved), which is exactly
# what makes "it works on my machine" excuses impossible - CI is a clean room.
#
# Two jobs, run in parallel: lint (fast, catches obvious mistakes) and test (the
# real proof). Read ../../knowledge/03_github_actions_anatomy.md for what every
# line here means.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint deps
        run: pip install ruff
      - name: Ruff check
        run: ruff check build_from_scratch/tldr build_from_scratch/tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"                     # cache pip downloads between runs - faster CI

      - name: Install dependencies
        working-directory: build_from_scratch
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: build_from_scratch
        run: pytest -q

      - name: Build the Docker image (proves the Dockerfile works, doesn't push it)
        working-directory: build_from_scratch
        run: docker build -t tldr-api:ci .

      - name: Smoke-test the built image
        run: |
          docker run -d --name smoke -p 8000:8000 tldr-api:ci
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8000/health; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8000/health
          docker logs smoke
          docker stop smoke
