# Render "Blueprint" - Infrastructure as Code for the host. Instead of clicking
# through a dashboard, this file fully describes the service. Commit it, and
# anyone (including future you) can recreate the exact same deployment.
#
# To use it for real: push this repo to GitHub, then on render.com choose
# "New -> Blueprint" and point it at the repo. Render reads this file. See
# hosting/HOSTING_GUIDE.md for the full walkthrough (free tier).

services:
  - type: web
    name: tldr-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: production
      - key: TLDR_MODEL
        value: offline          # flip to "gemini" once GEMINI_API_KEY is set below
      - key: GEMINI_API_KEY
        sync: false             # sync:false = set this secret in the Render dashboard,
                                 # NEVER here in the committed file
      - key: GIT_SHA
        fromGitBranch: main     # Render fills this with the deployed commit automatically
